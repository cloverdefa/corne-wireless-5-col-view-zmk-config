---
name: Release

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_type:
        description: Release version type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  actions: read

jobs:
  release:
    # ==============================================================
    # workflow_run:
    #   Only release when Build completed successfully.
    #
    # workflow_dispatch:
    #   Always allow manual release.
    # ==============================================================
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # Checkout main
      # ==============================================================
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ==============================================================
      # Get next version
      # ==============================================================
      - name: Get next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          # ----------------------------------------------------------
          # Find latest semantic version tag
          #
          # Supported:
          #   v1.0.1
          #   v1.1.0
          #   v2.0.0
          # ----------------------------------------------------------

          latest_tag="$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )"

          # ----------------------------------------------------------
          # First release
          # ----------------------------------------------------------

          if [ -z "$latest_tag" ]; then
            major=1
            minor=0
            patch=1

            echo "No existing release tag found."
          else
            version="${latest_tag#v}"

            IFS='.' read -r major minor patch <<< "$version"

            # --------------------------------------------------------
            # Determine release type
            # --------------------------------------------------------

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              release_type="${{ inputs.release_type }}"
            else
              release_type="patch"
            fi

            echo "Latest tag: $latest_tag"
            echo "Release type: $release_type"

            case "$release_type" in
              patch)
                patch=$((patch + 1))
                ;;

              minor)
                minor=$((minor + 1))
                patch=0
                ;;

              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;

              *)
                echo "::error::Invalid release type: $release_type"
                exit 1
                ;;
            esac
          fi

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          # ----------------------------------------------------------
          # Prevent duplicate tag
          # ----------------------------------------------------------

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "Next version: $version"
          echo "Next tag: $tag"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Download firmware artifact from Build workflow
      # ==============================================================
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # ==============================================================
      # Show firmware files
      # ==============================================================
      - name: Show firmware files
        shell: bash
        run: |
          echo "Firmware files:"
          find firmware -type f -print

      # ==============================================================
      # Create firmware ZIP
      # ==============================================================
      - name: Create firmware ZIP
        shell: bash
        run: |
          cd firmware
          zip -r "../firmware.zip" .
          cd ..

          echo "Created firmware.zip:"
          ls -lh firmware.zip

      # ==============================================================
      # Create GitHub Release
      # ==============================================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: firmware.zip
