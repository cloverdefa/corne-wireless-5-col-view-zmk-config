# =========================
# 🔋 功耗 / 藍牙
# =========================

# =========================
# Split Keyboard
# =========================

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_SLEEP=y

# 開啟高功率
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 藍牙連線間隔（平衡延遲與功耗）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# 降低背景掃描耗電
CONFIG_BT_BACKGROUND_SCAN_INTERVAL=512
CONFIG_BT_BACKGROUND_SCAN_WINDOW=36

CONFIG_ZMK_BEHAVIORS_MOD_TAP=y
CONFIG_ZMK_BEHAVIOR_MOD_TAP_TIMEOUT=150

# =========================
# 💤 睡眠設定
# =========================

CONFIG_ZMK_SLEEP=y

# 10 分鐘進入睡眠
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000


# =========================
# ⌨️ Key Scan（手感 & 穩定）
# =========================

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# =========================
# 🏷️ 裝置名稱
# =========================

CONFIG_ZMK_KEYBOARD_NAME="Corne-5"

# =========================
# 🖱️ Mouse
# =========================

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_DEFAULT_MOVE_VAL=600
CONFIG_ZMK_POINTING_DEFAULT_SCRL_VAL=20

# =========================
# 🧪 開發功能
# =========================

# 預設關閉（需要再開）
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

