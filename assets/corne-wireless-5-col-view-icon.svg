      <rect x="370" y="487" width="42" height="42" rx="10"/>
    </g>
    <!-- keycaps right -->
    <g fill="#394968" stroke="#b9a1ff" stroke-width="5">
      <rect x="602" y="383" width="42" height="42" rx="10"/>
      <rect x="651" y="374" width="42" height="42" rx="10"/>
      <rect x="700" y="366" width="42" height="42" rx="10"/>
      <rect x="749" y="374" width="42" height="42" rx="10"/>
      <rect x="798" y="383" width="42" height="42" rx="10"/>
      <rect x="607" y="435" width="42" height="42" rx="10"/>
      <rect x="656" y="426" width="42" height="42" rx="10"/>
      <rect x="705" y="418" width="42" height="42" rx="10"/>
      <rect x="754" y="426" width="42" height="42" rx="10"/>
      <rect x="803" y="435" width="42" height="42" rx="10"/>
      <rect x="612" y="487" width="42" height="42" rx="10"/>
