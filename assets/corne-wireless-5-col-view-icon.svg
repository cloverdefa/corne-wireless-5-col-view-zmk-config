  <circle cx="512" cy="484" r="7" fill="#7df9e8"/>
  <!-- small signal accents -->
  <path d="M464 540l-13 13m122-13 13 13" stroke="#7df9e8" stroke-width="7" stroke-linecap="round" opacity=".8"/>
