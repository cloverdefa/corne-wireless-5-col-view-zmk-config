    <rect x="238" y="604" width="118" height="27" rx="8" fill="#091321" stroke="#7df9e8" stroke-width="4"/>
    <rect x="668" y="604" width="118" height="27" rx="8" fill="#091321" stroke="#b9a1ff" stroke-width="4"/>
    <path d="M255 617h23m8 0h15m8 0h29" stroke="#7df9e8" stroke-width="4" stroke-linecap="round"/>
    <path d="M685 617h23m8 0h15m8 0h29" stroke="#b9a1ff" stroke-width="4" stroke-linecap="round"/>
