  <!-- wireless link between halves -->
  <g fill="none" stroke="url(#cyan)" stroke-width="10" stroke-linecap="round">
    <path d="M478 432 Q512 398 546 432"/>
    <path d="M490 449 Q512 428 534 449"/>
    <path d="M502 466 Q512 456 522 466"/>
