<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#202744"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#27344f"/>
      <stop offset="1" stop-color="#151e33"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df9e8"/>
      <stop offset="1" stop-color="#31bfe2"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3a6ff"/>
      <stop offset="1" stop-color="#8870ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#050914" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="218" fill="url(#bg)"/>
  <circle cx="512" cy="490" r="340" fill="#2d3b61" opacity=".18"/>
  <g filter="url(#shadow)" stroke-linejoin="round">
